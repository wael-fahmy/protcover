[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protcover"
version = "0.1.0"
description = "Family-aware conformal prediction for variant effect predictors on unseen protein families"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["protcover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
